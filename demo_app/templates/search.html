<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Portal - Product Search</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fafafa; }
    .search-container { max-width: 600px; margin: 20px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .search-bar { display: flex; gap: 8px; }
    input[type="search"] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 18px; background: #0066cc; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .results-area { margin-top: 25px; }
  </style>
</head>
<body>
  <div class="search-container">
    <h2>Catalog Search</h2>
    <p>Find components, modules, and documentation across the Apex ecosystem.</p>
    <form action="/search" method="GET">
      <div class="search-bar">
        <input type="search" id="q" name="q" placeholder="Enter keywords or item code..." required aria-label="Search items">
        <button type="submit" id="searchBtn">Search</button>
      </div>
    </form>
    <div class="results-area">
      <h3>Popular Categories</h3>
      <ul>
        <li>Microservices Architecture</li>
        <li>Security Scanners</li>
        <li>Continuous Integration Agents</li>
      </ul>
    </div>
  </div>
</body>
</html>
