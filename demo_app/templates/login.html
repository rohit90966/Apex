<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Portal - User Login</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #fafafa; }
    .login-card { max-width: 380px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px 12px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .aux-links { margin-top: 15px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Sign In to Apex</h2>
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter secure password" required>
      </div>
      <button type="submit" id="loginBtn">Log In</button>
    </form>
    <div class="aux-links">
      <a href="/registration">Create a new account</a> | <a href="/forgot">Forgot password?</a>
    </div>
  </div>
</body>
</html>
